<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BB7E5"/>
      <stop offset="0.55" stop-color="#C9CFD9"/>
      <stop offset="1" stop-color="#E5C896"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFE680"/>
      <stop offset="0.7" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF9433"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#sky)"/>
  <circle cx="660" cy="380" r="170" fill="url(#sun)"/>
  <g fill="#FFFFFF" filter="url(#soft)">
    <ellipse cx="350" cy="640" rx="135" ry="90"/>
    <ellipse cx="490" cy="595" rx="170" ry="115"/>
    <ellipse cx="660" cy="635" rx="150" ry="95"/>
    <ellipse cx="500" cy="700" rx="240" ry="80"/>
  </g>
</svg>
